<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ledger</title>
<style>
:root{
  --bg:#f3f5f4; --card:#ffffff; --ink:#15201b; --mute:#67756e; --line:#e2e7e4;
  --accent:#1f9d6b; --accent-ink:#ffffff; --soft:#e3f4ec;
  --in:#1f9d6b; --out:#e8595b; --warn:#e67700; --grid:#e9edeb;
  --c1:#1f9d6b;--c2:#3b82c4;--c3:#a855c4;--c4:#e8595b;--c5:#e9a23b;--c6:#14b8a6;--c7:#8b5cf6;--c8:#6b7280;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){ --bg:#0e1512; --card:#18201c; --ink:#e9efec; --mute:#93a199; --line:#283029;
    --accent:#34c585; --accent-ink:#06130c; --soft:#16302310;
    --in:#34c585; --out:#ff7a7c; --warn:#ffa94d; --grid:#232b26; }
}
:root[data-theme=dark]{ --bg:#0e1512; --card:#18201c; --ink:#e9efec; --mute:#93a199; --line:#283029;
    --accent:#34c585; --accent-ink:#06130c; --soft:#1d3a2b;
    --in:#34c585; --out:#ff7a7c; --warn:#ffa94d; --grid:#232b26; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Roboto,sans-serif;
  padding-bottom:calc(66px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;display:flex;align-items:center;gap:10px}
header h1{font-size:22px;margin:0;flex:1;letter-spacing:-.01em}
header .sub{color:var(--mute);font-size:13px}
main{padding:4px 16px 24px;max-width:720px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:8px 0 9px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600}
.bal{background:linear-gradient(135deg,var(--accent),#0f7a50);color:#fff;border:0}
.bal .k{font-size:13px;opacity:.85}
.bal .v{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 0 10px}
.bal .io{display:flex;gap:10px}
.bal .io div{flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:9px 11px}
.bal .io span{font-size:12px;opacity:.85;display:block}
.bal .io b{font-size:17px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.ic{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:19px}
.row .body{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.out{color:var(--out)} .amt.in{color:var(--in)}
.meta{color:var(--mute);font-size:12px;margin-top:1px;display:flex;flex-wrap:wrap;gap:4px 8px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:11px;font-weight:600}
.pill.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.pill.out{background:transparent;border:1px solid var(--out);color:var(--out)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600}
.btn.ghost{background:var(--soft);color:var(--accent)} .btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{background:transparent;color:var(--out);border:1px solid var(--out)}
.fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);border:0;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin:8px 0;overflow-x:auto}
.seg button{flex:1;white-space:nowrap;background:none;border:0;border-radius:8px;padding:7px 10px;color:var(--mute);font-size:13px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.monthnav{display:flex;align-items:center;gap:6px;margin:8px 0}
.monthnav b{flex:1;text-align:center;font-size:15px}
.monthnav button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;width:40px;height:36px;font-size:18px}
input,textarea,select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
label{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{color:var(--mute);text-align:center;padding:26px 10px}
.amountin{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 14px}
.amountin span{font-size:26px;color:var(--mute)}
.amountin input{border:0;background:none;font-size:34px;font-weight:700;padding:6px 0;letter-spacing:-.02em}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.catgrid button{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 4px 7px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.catgrid button .e{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px}
.catgrid button.on{border-color:var(--accent);background:var(--soft)}
.catgrid button .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 4px;font-size:18px}
.sheet .actions{display:flex;gap:8px;margin-top:18px}
.sheet .actions .btn{flex:1}
.bar{height:8px;border-radius:99px;background:var(--grid);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar i.over{background:var(--out)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .k{font-size:12px;color:var(--mute)} .tile .v{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:2px} .tile .d{font-size:12px;color:var(--mute)}
.hbar{display:grid;grid-template-columns:20px 94px 1fr auto;gap:8px;align-items:center;font-size:13px;margin:8px 0}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .hbar .v{color:var(--mute);font-variant-numeric:tabular-nums;text-align:right}
svg.chart{width:100%;height:auto;display:block} svg.chart text{fill:var(--mute);font-size:10px}
.donut{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.legend{flex:1;min-width:150px} .legend .lg{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.legend .dot{width:10px;height:10px;border-radius:3px;flex:none} .legend .v{margin-left:auto;color:var(--mute);font-variant-numeric:tabular-nums}
pre.report{white-space:pre-wrap;font:12.5px/1.5 ui-monospace,monospace;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:30;display:flex;gap:12px;align-items:center;max-width:92vw}
.toast button{background:none;border:0;color:inherit;font-weight:700;font-size:13px;padding:0;text-decoration:underline}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.keypad button{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 0;font-size:20px;font-weight:600}
</style>
</head>
<body>
<header><div style="flex:1"><h1 id="title"></h1><div class="sub" id="subtitle"></div></div>
<button class="btn ghost sm" id="searchBtn" aria-label="Search" style="padding:8px 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button></header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="Add transaction">+</button>
<nav id="nav"></nav>
<div id="modal"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
"use strict";
/* ---------- storage ---------- */
const KEY = "ledger.v1";
const DEFAULT_CATS = [
  {id:"food",name:"Food",icon:"🍚",color:"--c5",type:"expense"},
  {id:"groceries",name:"Groceries",icon:"🛒",color:"--c1",type:"expense"},
  {id:"transport",name:"Transport",icon:"🚌",color:"--c2",type:"expense"},
  {id:"bills",name:"Bills",icon:"💡",color:"--c4",type:"expense"},
  {id:"rent",name:"Rent",icon:"🏠",color:"--c7",type:"expense"},
  {id:"shopping",name:"Shopping",icon:"🛍️",color:"--c3",type:"expense"},
  {id:"health",name:"Health",icon:"💊",color:"--c6",type:"expense"},
  {id:"fun",name:"Fun",icon:"🎬",color:"--c8",type:"expense"},
  {id:"salary",name:"Salary",icon:"💼",color:"--c1",type:"income"},
  {id:"other-in",name:"Other income",icon:"➕",color:"--c6",type:"income"}
];
let db = load();
function load(){
  let d = null; try{ d = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  return normalize(d && Array.isArray(d.tx) ? d : {});
}
function normalize(d){
  return {tx:d.tx||[], cats:d.cats||DEFAULT_CATS.map(c=>({...c})), budgets:d.budgets||{},
    accounts:d.accounts && d.accounts.length ? d.accounts : [{id:"main",name:"Main",opening:0}],
    recurring:d.recurring||[], settings:Object.assign({currency:"$",theme:"system",start:1}, d.settings)};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast("Storage full"); } }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => ymd(new Date());
const curSym = () => db.settings.currency;
function money(n, signed){
  const neg = n < 0, a = Math.abs(n), s = curSym() + a.toLocaleString(undefined,{minimumFractionDigits:a%1?2:0,maximumFractionDigits:2});
  return (signed ? (neg?"−":"") : (neg?"−":"")) + s;
}
const monthKey = s => s.slice(0,7);
const nowMonth = () => today().slice(0,7);
function monthLabel(mk){ const [y,m]=mk.split("-"); return new Date(y,m-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"}); }
function shiftMonth(mk,n){ const [y,m]=mk.split("-").map(Number); const d=new Date(y,m-1+n,1); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
const cat = id => db.cats.find(c=>c.id===id) || {name:"Uncategorised",icon:"•",color:"--c8",type:"expense"};
const acct = id => db.accounts.find(a=>a.id===id) || db.accounts[0];
const cvar = c => `var(${c})`;
function toast(msg, undo){
  document.querySelectorAll(".toast").forEach(x=>x.remove());
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  if(undo){ const b=document.createElement("button"); b.textContent="Undo"; b.onclick=()=>{t.remove();undo();}; t.appendChild(b); }
  document.body.appendChild(t); setTimeout(()=>t.remove(), undo?5000:2400);
}
function applyTheme(){ const t=db.settings.theme; if(t==="system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=t; }

/* ---------- recurring ---------- */
function runRecurring(){
  const td = today(); let made = 0;
  db.recurring.forEach(r => {
    let next = r.next || r.start;
    while(next && next <= td){
      db.tx.push({id:uid(),type:r.type,amount:r.amount,catId:r.catId,acctId:r.acctId,date:next,note:r.note||"",recurId:r.id,createdAt:Date.now()});
      made++; next = advance(next, r.freq);
    }
    r.next = next;
  });
  if(made){ save(); }
}
function advance(d, freq){
  const o = new Date(d+"T00:00:00");
  if(freq==="weekly") o.setDate(o.getDate()+7);
  else if(freq==="yearly") o.setFullYear(o.getFullYear()+1);
  else o.setMonth(o.getMonth()+1);
  return ymd(o);
}

/* ---------- computed ---------- */
function balance(){ return db.accounts.reduce((s,a)=>s+a.opening,0) + db.tx.reduce((s,t)=>s+(t.type==="income"?t.amount:-t.amount),0); }
function monthTx(mk){ return db.tx.filter(t=>monthKey(t.date)===mk); }
function sums(list){ const i=list.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0), e=list.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0); return {i,e,net:i-e}; }
function byCat(list){ const m={}; list.filter(t=>t.type==="expense").forEach(t=>m[t.catId]=(m[t.catId]||0)+t.amount); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }

/* ---------- nav ---------- */
const TABS=[
  ["home","Home",'<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/>'],
  ["tx","Activity",'<path d="M4 7h16M4 12h16M4 17h10"/>'],
  ["budgets","Budgets",'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
  ["insights","Insights",'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>']
];
let state={tab:"home", month:nowMonth(), txType:"all", insTab:"analytics"};
function renderNav(){ $("#nav").innerHTML=TABS.map(([id,l,p])=>`<button data-tab="${id}" class="${state.tab===id?"on":""}"><svg viewBox="0 0 24 24">${p}</svg>${l}</button>`).join(""); }
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b){state.tab=b.dataset.tab;if(b.dataset.tab==="insights")state.insTab="analytics";render();window.scrollTo(0,0);}};
function render(){ renderNav(); state.tab==="insights" ? ({analytics:viewInsights,reports:viewReports,settings:viewSettings})[state.insTab]() : ({home:viewHome,tx:viewTx,budgets:viewBudgets})[state.tab](); }
$("#fab").onclick=()=>editTx();

/* ---------- transaction row ---------- */
function txRow(t){
  const c=cat(t.catId);
  return `<div class="row" data-tx="${t.id}"><div class="ic" style="background:${cvar(c.color)}22;color:${cvar(c.color)}">${c.icon}</div>
    <div class="body"><div class="t">${t.note?esc(t.note):esc(c.name)}</div>
    <div class="meta"><span>${esc(c.name)}</span>${db.accounts.length>1?`<span>${esc(acct(t.acctId).name)}</span>`:""}${t.recurId?"<span>↻</span>":""}<span>${fmtD(t.date)}</span></div></div>
    <div class="amt ${t.type==="income"?"in":"out"}">${t.type==="income"?"+":"−"}${money(t.amount)}</div></div>`;
}
const fmtD=s=>new Date(s+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});

$("#view").addEventListener("click",e=>{
  const el=e.target.closest("[data-tx],[data-cat],[data-set],[data-act],[data-acct],[data-recur],[data-thm]");
  if(!el)return; const d=el.dataset;
  if(d.tx) editTx(db.tx.find(x=>x.id===d.tx));
  else if(d.cat) editBudget(d.cat);
  else if(d.acct) editAccount(db.accounts.find(a=>a.id===d.acct));
  else if(d.recur) editRecurring(db.recurring.find(r=>r.id===d.recur));
  else if(d.thm){ db.settings.theme=d.thm; save(); applyTheme(); render(); }
  else if(d.set){ const[k,v]=d.set.split(":"); state[k]=v; render(); }
  else if(d.act) ACTIONS[d.act]();
});

/* ---------- Home ---------- */
function viewHome(){
  runRecurring();
  $("#title").textContent="Ledger"; $("#subtitle").textContent="";
  const mk=nowMonth(), mt=monthTx(mk), s=sums(mt), bal=balance();
  const fresh=!db.tx.length;
  const recent=db.tx.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt).slice(0,6);
  const bl=budgetLines(mk).filter(b=>b.limit>0).slice(0,3);
  const saveRate = s.i ? Math.round(100*s.net/s.i) : null;
  $("#view").innerHTML=`
    ${fresh?`<div class="card"><h3>Welcome</h3><p style="margin:0 0 10px">Track money in and out, set monthly budgets and see where it goes. Everything stays on this phone.</p><button class="btn ghost sm" data-act="sample">Try it with sample data</button></div>`:""}
    <div class="card bal"><div class="k">Total balance</div><div class="v">${money(bal)}</div>
      <div class="io"><div><span>Income · ${monthLabel(mk).split(" ")[0]}</span><b>+${money(s.i)}</b></div>
      <div><span>Spent</span><b>−${money(s.e)}</b></div></div></div>
    <div class="tiles"><div class="tile"><div class="k">Net this month</div><div class="v" style="color:${s.net>=0?"var(--in)":"var(--out)"}">${s.net>=0?"+":"−"}${money(s.net)}</div><div class="d">${saveRate===null?"no income yet":saveRate+"% of income saved"}</div></div>
      <div class="tile"><div class="k">Transactions</div><div class="v">${mt.length}</div><div class="d">this month</div></div></div>
    ${bl.length?`<div class="card"><h3>Top budgets</h3>${bl.map(budgetBar).join("")}<button class="btn ghost sm" data-set="tab:budgets" style="margin-top:10px">All budgets</button></div>`:""}
    <div class="card"><h3>Recent activity</h3>${recent.length?recent.map(txRow).join(""):'<div class="empty">No transactions yet. Tap + to add one.</div>'}
      ${db.tx.length>6?`<button class="btn ghost sm" data-set="tab:tx" style="margin-top:10px">See all</button>`:""}</div>`;
}

/* ---------- Activity ---------- */
function viewTx(){
  $("#title").textContent="Activity";
  const mk=state.month, mt=monthTx(mk).filter(t=>state.txType==="all"||t.type===state.txType).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);
  const s=sums(monthTx(mk));
  $("#subtitle").textContent=`+${money(s.i)} · −${money(s.e)}`;
  const groups={}; mt.forEach(t=>{(groups[t.date]=groups[t.date]||[]).push(t);});
  $("#view").innerHTML=`
    <div class="monthnav"><button data-act="prevM" aria-label="Previous month">‹</button><b>${monthLabel(mk)}</b><button data-act="nextM" aria-label="Next month">›</button></div>
    <div class="seg">${[["all","All"],["expense","Spending"],["income","Income"]].map(([k,l])=>`<button data-set="txType:${k}" class="${state.txType===k?"on":""}">${l}</button>`).join("")}</div>
    ${mt.length?Object.keys(groups).map(day=>`<div class="card"><h3>${new Date(day+"T00:00:00").toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"short"})}</h3>${groups[day].map(txRow).join("")}</div>`).join(""):'<div class="empty">Nothing in this month.</div>'}`;
}

/* ---------- add / edit transaction ---------- */
function editTx(t){
  const isNew=!t;
  t=t||{type:"expense",amount:0,catId:"",acctId:db.accounts[0].id,date:today(),note:""};
  let type=t.type, catId=t.catId||(db.cats.find(c=>c.type===type)||{}).id, amtStr=t.amount?String(t.amount):"";
  const body=()=>`
    <div class="seg" id="typeSeg"><button data-ty="expense" class="${type==="expense"?"on":""}">Expense</button><button data-ty="income" class="${type==="income"?"on":""}">Income</button></div>
    <div class="amountin"><span>${esc(curSym())}</span><input id="f_amt" inputmode="decimal" placeholder="0" value="${esc(amtStr)}"></div>
    <label>Category</label><div class="catgrid" id="catGrid">${db.cats.filter(c=>c.type===type).map(c=>`<button type="button" data-c="${c.id}" class="${catId===c.id?"on":""}"><span class="e" style="background:${cvar(c.color)}22;color:${cvar(c.color)}">${c.icon}</span><span class="nm">${esc(c.name)}</span></button>`).join("")}</div>
    <div class="two"><div><label>Date</label><input type="date" id="f_date" value="${esc(t.date)}"></div>
    ${db.accounts.length>1?`<div><label>Account</label><select id="f_acct">${db.accounts.map(a=>`<option value="${a.id}" ${t.acctId===a.id?"selected":""}>${esc(a.name)}</option>`).join("")}</select></div>`:`<div><label>Note</label><input id="f_note2" value="${esc(t.note)}" placeholder="Optional"></div>`}</div>

/* ---------- Budgets ---------- */
function budgetLines(mk){
  const spent={}; monthTx(mk).filter(t=>t.type==="expense").forEach(t=>spent[t.catId]=(spent[t.catId]||0)+t.amount);
  return db.cats.filter(c=>c.type==="expense").map(c=>({c,limit:db.budgets[c.id]||0,spent:spent[c.id]||0}))
    .sort((a,b)=>(b.limit>0)-(a.limit>0)||b.spent-a.spent);
}
function budgetBar(b){
  const pctv=b.limit?Math.min(100,Math.round(100*b.spent/b.limit)):0, over=b.limit&&b.spent>b.limit;
  return `<div class="row" data-cat="${b.c.id}" style="align-items:flex-start"><div class="ic" style="background:${cvar(b.c.color)}22;color:${cvar(b.c.color)}">${b.c.icon}</div>

    <span class="amt" style="font-weight:600">${money(b.spent)}${b.limit?` <span style="color:var(--mute);font-weight:400">/ ${money(b.limit)}</span>`:""}</span></div>
    ${b.limit?`<div class="bar"><i class="${over?"over":""}" style="width:${pctv}%;${!over?`background:${cvar(b.c.color)}`:""}"></i></div>
      <div class="meta">${over?`<span class="pill out">${money(b.spent-b.limit)} over</span>`:`<span>${money(b.limit-b.spent)} left</span>`}</div>`:`<div class="meta"><span>Tap to set a budget</span></div>`}</div></div>`;
}

/* ---------- Insights ---------- */
function donut(rows, total){
  if(!total) return "";
  let a=-Math.PI/2; const R=52,C=60,seg=rows.map(([id,v])=>{const c=cat(id),frac=v/total,a2=a+frac*2*Math.PI,x1=C+R*Math.cos(a),y1=C+R*Math.sin(a),x2=C+R*Math.cos(a2),y2=C+R*Math.sin(a2),big=frac>.5?1:0;a=a2;return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 ${big} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="${cvar(c.color)}" stroke-width="16"/>`;}).join("");
  return `<svg class="chart" viewBox="0 0 120 120" style="width:120px;flex:none"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--grid)" stroke-width="16"/>${seg}<text x="60" y="58" text-anchor="middle" style="fill:var(--ink);font-size:9px;font-weight:600">Spent</text><text x="60" y="70" text-anchor="middle" style="fill:var(--ink);font-size:11px;font-weight:700">${esc(money(total))}</text></svg>`;
}
function trendChart(months){
  const W=340,H=150,L=30,B=22,T=8; const maxV=Math.max(1,...months.map(m=>Math.max(m.i,m.e)));
  const bw=(W-L-6)/months.length, y=v=>T+(H-T-B)*(1-v/maxV);
  const ticks=[0,maxV/2,maxV];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    ${ticks.map(v=>`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${curSym()}${Math.round(v)}</text>`).join("")}
    ${months.map((m,i)=>{const x=L+i*bw+bw/2;return `<rect x="${x-bw*0.32}" y="${y(m.i)}" width="${bw*0.28}" height="${H-B-y(m.i)}" rx="2" fill="var(--in)"><title>Income ${money(m.i)}</title></rect><rect x="${x+bw*0.04}" y="${y(m.e)}" width="${bw*0.28}" height="${H-B-y(m.e)}" rx="2" fill="var(--out)"><title>Spent ${money(m.e)}</title></rect><text x="${x}" y="${H-6}" text-anchor="middle">${m.label}</text>`;}).join("")}</svg>
    <div class="meta" style="justify-content:center;gap:16px;margin-top:4px"><span><span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--in)"></span> Income</span><span><span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--out)"></span> Spent</span></div>`;
}

      <div class="tile"><div class="k">Income</div><div class="v">${money(s.i)}</div><div class="d">net ${s.net>=0?"+":"−"}${money(s.net)}</div></div>

/* ---------- reports ---------- */
function buildReport(){
  const mk=state.month, mt=monthTx(mk), s=sums(mt), bc=byCat(mt), L=[];
  L.push("MONTHLY STATEMENT", monthLabel(mk), "");
  L.push("SUMMARY");
  L.push(`  Income:    ${money(s.i)}`);
  L.push(`  Spending:  ${money(s.e)}`);
  L.push(`  Net:       ${s.net>=0?"+":"−"}${money(s.net)}`);
  L.push(`  Savings:   ${s.i?Math.round(100*s.net/s.i)+"% of income":"n/a"}`);
  L.push(`  Balance:   ${money(balance())} (all accounts, to date)`,"");
  L.push("SPENDING BY CATEGORY");
  if(bc.length) bc.forEach(([id,v])=>L.push(`  ${cat(id).name.padEnd(16)} ${money(v).padStart(10)}  ${Math.round(100*v/s.e)}%`)); else L.push("  No spending.");
  L.push("","BUDGETS");
  const bl=budgetLines(mk).filter(b=>b.limit>0);
  if(bl.length) bl.forEach(b=>L.push(`  ${b.c.name.padEnd(16)} ${money(b.spent).padStart(10)} / ${money(b.limit)}  ${b.spent>b.limit?"OVER by "+money(b.spent-b.limit):money(b.limit-b.spent)+" left"}`)); else L.push("  No budgets set.");
  return L.join("\n");
}

function saveFile(name,mime,text){ if(window.Android&&Android.saveFile){Android.saveFile(name,mime,text);return;} const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;a.click(); }

const csvCell=v=>{let s=String(v??"");if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
const ACTIONS={
  prevM(){state.month=shiftMonth(state.month,-1);render();},
  nextM(){state.month=shiftMonth(state.month,1);render();},
  goReports(){state.insTab='reports';render();}, goSettings(){state.insTab='settings';render();},

  exportJson(){saveFile(`ledger-backup-${today()}.json`,"application/json",JSON.stringify(db,null,2));},
  exportCsv(){const rows=[["Date","Type","Amount","Category","Account","Note"]].concat(db.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type,t.amount,cat(t.catId).name,acct(t.acctId).name,t.note||""]));saveFile(`transactions-${today()}.csv`,"text/csv",rows.map(r=>r.map(csvCell).join(",")).join("\r\n"));},
  importJson(){$("#importFile").value="";$("#importFile").click();},
  addAccount(){editAccount();}, addRecur(){editRecurring();},
  wipe(){confirmSheet("Delete all data?","Every transaction, budget, account and recurring item on this phone will be removed. This cannot be undone.","Delete everything",()=>{db=normalize({settings:db.settings});save();render();toast("All data deleted");});},
  sample(){loadSample();}
};
db.cats.forEach(()=>{}); // noop keep
["$","£","€","₹","₨","¥","A$"].forEach(c=>ACTIONS["cur_"+c]=()=>{db.settings.currency=c;save();render();});

  db.recurring.push({id:uid(),type:"expense",catId:"rent",amount:950,freq:"monthly",start:mk(70),next:(()=>{const d=new Date(td);d.setDate(1);d.setMonth(d.getMonth()+1);return ymd(d);})(),note:"Rent",acctId:"main"});

  const sh=sheet("Search transactions",`<input id="q" placeholder="Note, category or amount" style="margin-bottom:8px"><div id="qr"></div>`,null,null,true);
  const run=()=>{const q=$("#q").value.trim().toLowerCase();if(!q){$("#qr").innerHTML='<div class="empty">Type to search.</div>';return;}
    const rows=db.tx.filter(t=>cat(t.catId).name.toLowerCase().includes(q)||(t.note||"").toLowerCase().includes(q)||String(t.amount).includes(q)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60);
    $("#qr").innerHTML=rows.length?rows.map(txRow).join(""):'<div class="empty">No matches.</div>';};
  $("#q").oninput=run;run();$("#q").focus();
  $("#qr").onclick=e=>{const r=e.target.closest("[data-tx]");if(r){const t=db.tx.find(x=>x.id===r.dataset.tx);closeSheet();editTx(t);}};
};

/* ---------- sheets ---------- */
function closeSheet(){$("#modal").innerHTML="";}
function sheet(title,body,onSave,onDelete,noButtons){
  $("#modal").innerHTML=`<div class="sheet-bg"><div class="sheet"><h2>${esc(title)}</h2><div id="sheetBody">${body}</div>
    ${noButtons?`<div class="actions"><button class="btn ghost" id="s_cancel">Close</button></div>`:`<div class="actions">${onDelete?'<button class="btn danger" id="s_del">Delete</button>':""}<button class="btn ghost" id="s_cancel">Cancel</button><button class="btn" id="s_save">Save</button></div>`}</div></div>`;
  $("#s_cancel").onclick=closeSheet;
  $(".sheet-bg").onclick=e=>{if(e.target.classList.contains("sheet-bg"))closeSheet();};
  if(onSave)$("#s_save").onclick=()=>{if(onSave()===false)return;save();closeSheet();render();};
  if(onDelete)$("#s_del").onclick=()=>{const snap=JSON.stringify(db);onDelete();save();closeSheet();render();toast("Deleted",()=>{db=normalize(JSON.parse(snap));save();render();});};
  return $("#modal");
}
function confirmSheet(title,msg,okLabel,onOk){
  $("#modal").innerHTML=`<div class="sheet-bg"><div class="sheet"><h2>${esc(title)}</h2><p style="color:var(--mute)">${esc(msg)}</p><div class="actions"><button class="btn ghost" id="s_cancel">Cancel</button><button class="btn danger" id="s_ok">${esc(okLabel)}</button></div></div></div>`;
  $("#s_cancel").onclick=closeSheet;$("#s_ok").onclick=()=>{closeSheet();onOk();};
}
window.handleBack=()=>{if($("#modal").innerHTML){closeSheet();return true;}if(state.tab!=="home"){state.tab="home";render();return true;}return false;};
applyTheme(); runRecurring(); render();
</script>
