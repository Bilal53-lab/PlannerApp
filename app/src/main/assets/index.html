<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>My Workspace</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#16181d; --mute:#6b7280; --line:#e3e5ea;
  --accent:#3b5bdb; --accent-ink:#ffffff; --soft:#e8ecfb;
  --good:#2b8a3e; --warn:#e67700; --bad:#c92a2a; --grid:#e9ebef;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#101216; --card:#1a1d23; --ink:#eceef2; --mute:#9aa1ad; --line:#2a2e37;
    --accent:#748ffc; --accent-ink:#0d1020; --soft:#232a45;
    --good:#51cf66; --warn:#ffa94d; --bad:#ff6b6b; --grid:#262a32; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Roboto,sans-serif;
  padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;display:flex;align-items:center;gap:10px}
header h1{font-size:22px;margin:0;flex:1;letter-spacing:-.01em}
header .sub{color:var(--mute);font-size:13px}
main{padding:4px 16px 24px;max-width:720px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:8px 0 9px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600}
.row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .body{flex:1;min-width:0}
.row .t{font-weight:500;word-wrap:break-word}
.row.done .t{text-decoration:line-through;color:var(--mute)}
.meta{color:var(--mute);font-size:12px;margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--mute);background:none;flex:none;margin-top:1px;padding:0;color:transparent}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.chk::after{content:"✓";font-size:14px;line-height:20px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:11px;font-weight:600}
.pill.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.pill.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.pill.good{background:transparent;border:1px solid var(--good);color:var(--good)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:18px;
  background:var(--accent);color:var(--accent-ink);border:0;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin:8px 0;overflow-x:auto}
.seg button{flex:1;white-space:nowrap;background:none;border:0;border-radius:8px;padding:7px 10px;color:var(--mute);font-size:13px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
input,textarea,select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
textarea{min-height:120px;resize:vertical}
label{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px;font-weight:600}
.search{margin:8px 0}
.empty{color:var(--mute);text-align:center;padding:26px 10px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 4px;font-size:18px}
.sheet .actions{display:flex;gap:8px;margin-top:18px}
.sheet .actions .btn{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .k{font-size:12px;color:var(--mute)}
.tile .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.tile .d{font-size:12px;color:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--grid);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hbar{display:grid;grid-template-columns:96px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.hbar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .v{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.note{white-space:pre-wrap;color:var(--mute);font-size:13px;max-height:3.9em;overflow:hidden}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--mute);font-size:10px}
pre.report{white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:99px;font-size:13px;z-index:30}
</style>
</head>
<body>
<header><div style="flex:1"><h1 id="title"></h1><div class="sub" id="subtitle"></div></div></header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="Add">+</button>
<nav id="nav"></nav>
<div id="modal"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
"use strict";
/* ---------- storage ---------- */
const KEY = "workspace.v1";
let db = load();
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.tasks) return d; }catch(e){}
  return {tasks:[],notes:[],goals:[],projects:[]};
}
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => ymd(new Date());
const addDays = (s,n) => { const d = new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return ymd(d); };
const fmtDate = s => s ? new Date(s+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"}) : "";
const dayOf = ts => ymd(new Date(ts));
const PRI = {1:"High",2:"Medium",3:"Low"};
const COLORS = ["#3b5bdb","#0c8599","#2b8a3e","#e67700","#c2255c","#7048e8","#5c940d","#868e96"];
const proj = id => db.projects.find(p => p.id === id);
const goal = id => db.goals.find(g => g.id === id);
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function goalProgress(g){
  const linked = db.tasks.filter(t => t.goalId === g.id);
  if(linked.length) return Math.round(100*linked.filter(t=>t.done).length/linked.length);
  return g.progress || 0;
}
function projProgress(p){
  const ts = db.tasks.filter(t => t.projectId === p.id);
  return {total:ts.length, done:ts.filter(t=>t.done).length, pct: ts.length ? Math.round(100*ts.filter(t=>t.done).length/ts.length) : 0};
}

/* ---------- navigation ---------- */
const TABS = [
  ["today","Today",'<path d="M4 7h16M4 12h16M4 17h10"/>'],
  ["tasks","Tasks",'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h10"/>'],
  ["notes","Notes",'<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7M9 8h3"/>'],
  ["plan","Plan",'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'],
  ["insights","Insights",'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>']
];
let state = {tab:"today", taskFilter:"open", noteQ:"", planSeg:"goals", range:30, insSeg:"analytics", reportPeriod:"week"};
function renderNav(){
  $("#nav").innerHTML = TABS.map(([id,l,p]) => `<button data-tab="${id}" class="${state.tab===id?"on":""}"><svg viewBox="0 0 24 24">${p}</svg>${l}</button>`).join("");
}
$("#nav").onclick = e => { const b = e.target.closest("button"); if(b){ state.tab = b.dataset.tab; render(); window.scrollTo(0,0);} };
function render(){
  renderNav();
  ({today:viewToday,tasks:viewTasks,notes:viewNotes,plan:viewPlan,insights:viewInsights})[state.tab]();
  $("#fab").style.display = state.tab === "insights" ? "none" : "";
}
$("#fab").onclick = () => {
  if(state.tab==="notes") editNote();
  else if(state.tab==="plan") state.planSeg==="goals" ? editGoal() : editProject();
  else editTask();
};

/* ---------- task rows ---------- */
function taskRow(t){
  const p = proj(t.projectId), g = goal(t.goalId), td = today();
  let due = "";
  if(t.due){
    const cls = !t.done && t.due < td ? "bad" : (!t.done && t.due === td ? "warn" : "");
    due = `<span class="pill ${cls}">${t.due<td&&!t.done?"Overdue · ":""}${fmtDate(t.due)}</span>`;
  }
  return `<div class="row ${t.done?"done":""}">
    <button class="chk ${t.done?"on":""}" data-toggle="${t.id}" aria-label="Toggle done"></button>
    <div class="body" data-task="${t.id}"><div class="t">${esc(t.title)}</div>
    <div class="meta">${due}${t.priority==1?'<span class="pill bad">High</span>':""}
      ${p?`<span><span class="dot" style="background:${p.color}"></span> ${esc(p.name)}</span>`:""}
      ${g?`<span>◎ ${esc(g.title)}</span>`:""}</div></div></div>`;
}
function sortTasks(a,b){ return (a.done-b.done) || ((a.due||"9999").localeCompare(b.due||"9999")) || (a.priority-b.priority) || (b.createdAt-a.createdAt); }
$("#view").addEventListener("click", e => {
  const tg = e.target.closest("[data-toggle]");
  if(tg){ const t = db.tasks.find(x=>x.id===tg.dataset.toggle); t.done=!t.done; t.doneAt = t.done?Date.now():null; save(); render(); return; }
  const el = e.target.closest("[data-task],[data-note],[data-goal],[data-project],[data-act],[data-set]");
  if(!el) return;
  const d = el.dataset;
  if(d.task) editTask(db.tasks.find(x=>x.id===d.task));
  else if(d.note) editNote(db.notes.find(x=>x.id===d.note));
  else if(d.goal) editGoal(db.goals.find(x=>x.id===d.goal));
  else if(d.project) editProject(db.projects.find(x=>x.id===d.project));
  else if(d.set){ const [k,v] = d.set.split(":"); state[k] = k==="range" ? +v : v; render(); }
  else if(d.act) ACTIONS[d.act]();
});

/* ---------- Today ---------- */
function viewToday(){
  const td = today(), open = db.tasks.filter(t=>!t.done);
  const overdue = open.filter(t=>t.due && t.due<td).sort(sortTasks);
  const due = open.filter(t=>t.due===td).sort(sortTasks);
  const soon = open.filter(t=>t.due>td && t.due<=addDays(td,7)).sort(sortTasks);
  const doneToday = db.tasks.filter(t=>t.done && dayOf(t.doneAt)===td);
  $("#title").textContent = "Today";
  $("#subtitle").textContent = new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  const total = due.length + doneToday.length + overdue.length;
  const pct = total ? Math.round(100*doneToday.length/total) : 0;
  const sect = (title, list, emptyMsg) => `<div class="card"><h3>${title}${list.length?` · ${list.length}`:""}</h3>${list.length?list.map(taskRow).join(""):`<div class="empty">${emptyMsg}</div>`}</div>`;
  const goals = db.goals.filter(g=>g.status!=="done").slice(0,3);
  $("#view").innerHTML = `
    <div class="card"><h3>Day progress</h3><div style="display:flex;justify-content:space-between"><b>${doneToday.length} done</b><span class="sub" style="color:var(--mute)">${due.length+overdue.length} left</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
    ${overdue.length?sect("Overdue",overdue,""):""}
    ${sect("Due today",due,"Nothing due today. Tap + to add a task.")}
    ${soon.length?sect("Next 7 days",soon,""):""}
    ${doneToday.length?sect("Completed today",doneToday,""):""}
    ${goals.length?`<div class="card"><h3>Active goals</h3>${goals.map(goalRow).join("")}</div>`:""}`;
}

/* ---------- Tasks ---------- */
function viewTasks(){
  $("#title").textContent = "Tasks";
  const f = state.taskFilter, td = today();
  let list = db.tasks.filter(t => f==="open" ? !t.done : f==="done" ? t.done : f==="overdue" ? (!t.done && t.due && t.due<td) : f==="high" ? (!t.done && t.priority==1) : true).sort(sortTasks);
  if(f==="done") list.sort((a,b)=>b.doneAt-a.doneAt);
  $("#subtitle").textContent = `${db.tasks.filter(t=>!t.done).length} open · ${db.tasks.filter(t=>t.done).length} completed`;
  const seg = [["open","Open"],["overdue","Overdue"],["high","High priority"],["done","Done"],["all","All"]];
  $("#view").innerHTML = `<div class="seg">${seg.map(([k,l])=>`<button data-set="taskFilter:${k}" class="${f===k?"on":""}">${l}</button>`).join("")}</div>
    <div class="card">${list.length?list.map(taskRow).join(""):'<div class="empty">No tasks here.</div>'}</div>`;
}
function editTask(t){
  const isNew = !t; t = t || {title:"",notes:"",due:state.tab==="today"?today():"",priority:2,projectId:"",goalId:""};
  sheet(`${isNew?"New task":"Edit task"}`, `
    <label>Title</label><input id="f_title" value="${esc(t.title)}" placeholder="What needs doing?">
    <div class="two"><div><label>Due date</label><input type="date" id="f_due" value="${esc(t.due||"")}"></div>
    <div><label>Priority</label><select id="f_pri">${[1,2,3].map(n=>`<option value="${n}" ${t.priority==n?"selected":""}>${PRI[n]}</option>`).join("")}</select></div></div>
    <div class="two"><div><label>Project</label><select id="f_proj"><option value="">None</option>${db.projects.map(p=>`<option value="${p.id}" ${t.projectId===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div>
    <div><label>Goal</label><select id="f_goal"><option value="">None</option>${db.goals.map(g=>`<option value="${g.id}" ${t.goalId===g.id?"selected":""}>${esc(g.title)}</option>`).join("")}</select></div></div>
    <label>Details</label><textarea id="f_notes" style="min-height:80px">${esc(t.notes||"")}</textarea>`,
    () => {
      const title = $("#f_title").value.trim(); if(!title) return toast("Add a title"), false;
      Object.assign(t,{title,due:$("#f_due").value,priority:+$("#f_pri").value,projectId:$("#f_proj").value,goalId:$("#f_goal").value,notes:$("#f_notes").value});
      if(isNew) db.tasks.push(Object.assign(t,{id:uid(),done:false,doneAt:null,createdAt:Date.now()}));
    }, isNew?null:() => { db.tasks = db.tasks.filter(x=>x!==t); });
}

/* ---------- Notes ---------- */
function viewNotes(){
  $("#title").textContent = "Notes"; $("#subtitle").textContent = `${db.notes.length} note${db.notes.length===1?"":"s"}`;
  $("#view").innerHTML = `<input class="search" id="noteQ" placeholder="Search notes and #tags" value="${esc(state.noteQ)}"><div id="noteList"></div>`;
  $("#noteQ").oninput = e => { state.noteQ = e.target.value; noteList(); };
  noteList();
}
function noteList(){
  const q = state.noteQ.trim().toLowerCase();
  const list = db.notes.filter(n => !q || (n.title+" "+n.body+" "+(n.tags||[]).map(t=>"#"+t).join(" ")).toLowerCase().includes(q))
    .sort((a,b)=>(b.pinned-a.pinned)||(b.updatedAt-a.updatedAt));
  $("#noteList").innerHTML = list.length ? list.map(n=>`<div class="card" data-note="${n.id}">
      <div class="t" style="font-weight:600">${n.pinned?"📌 ":""}${esc(n.title||"Untitled")}</div>
      <div class="note">${esc(n.body)}</div>
      <div class="meta">${(n.tags||[]).map(t=>`<span class="pill">#${esc(t)}</span>`).join("")}<span>${new Date(n.updatedAt).toLocaleDateString(undefined,{month:"short",day:"numeric"})}</span></div></div>`).join("")
    : `<div class="empty">${q?"No notes match.":"No notes yet. Tap + to write one."}</div>`;
}
function editNote(n){
  const isNew = !n; n = n || {title:"",body:"",tags:[],pinned:false};
  sheet(isNew?"New note":"Edit note", `
    <label>Title</label><input id="f_title" value="${esc(n.title)}" placeholder="Title">
    <label>Note</label><textarea id="f_body" style="min-height:220px" placeholder="Write here…">${esc(n.body)}</textarea>
    <label>Tags (comma separated)</label><input id="f_tags" value="${esc((n.tags||[]).join(", "))}" placeholder="ideas, work">
    <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="f_pin" style="width:auto" ${n.pinned?"checked":""}> Pin to top</label>`,
    () => {
      const title=$("#f_title").value.trim(), body=$("#f_body").value;
      if(!title && !body.trim()) return toast("Note is empty"), false;
      Object.assign(n,{title,body,tags:$("#f_tags").value.split(",").map(s=>s.trim().replace(/^#/,"")).filter(Boolean),pinned:$("#f_pin").checked,updatedAt:Date.now()});
      if(isNew) db.notes.push(Object.assign(n,{id:uid(),createdAt:Date.now()}));
    }, isNew?null:() => { db.notes = db.notes.filter(x=>x!==n); });
}

/* ---------- Plan: goals & projects ---------- */
function goalRow(g){
  const pct = goalProgress(g), late = g.status!=="done" && g.target && g.target < today();
  return `<div class="row" data-goal="${g.id}"><div class="body"><div class="t">${esc(g.title)}</div>
    <div class="meta"><span class="pill">${g.horizon==="long"?"Long-term":"Short-term"}</span>
    ${g.status==="done"?'<span class="pill good">Achieved</span>':""}
    ${g.target?`<span class="pill ${late?"bad":""}">${late?"Past target · ":"Target "}${fmtDate(g.target)}</span>`:""}<span>${pct}%</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div></div></div>`;
}
function viewPlan(){
  $("#title").textContent = "Plan"; $("#subtitle").textContent = `${db.goals.length} goals · ${db.projects.length} projects`;
  const s = state.planSeg;
  let html = `<div class="seg"><button data-set="planSeg:goals" class="${s==="goals"?"on":""}">Goals</button><button data-set="planSeg:projects" class="${s==="projects"?"on":""}">Projects</button></div>`;
  if(s==="goals"){
    const grp = h => db.goals.filter(g=>g.horizon===h).sort((a,b)=>(a.status==="done")-(b.status==="done")||(a.target||"9999").localeCompare(b.target||"9999"));
    const sh = grp("short"), lg = grp("long");
    html += `<div class="card"><h3>Short-term goals</h3>${sh.length?sh.map(goalRow).join(""):'<div class="empty">Weeks to a few months out.</div>'}</div>
             <div class="card"><h3>Long-term goals</h3>${lg.length?lg.map(goalRow).join(""):'<div class="empty">The big, year-plus ones.</div>'}</div>`;
  } else {
    html += db.projects.length ? db.projects.map(p=>{ const pr = projProgress(p);
      return `<div class="card" data-project="${p.id}"><div style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:${p.color}"></span><b style="flex:1">${esc(p.name)}</b>
        <span class="pill ${p.status==="done"?"good":p.status==="paused"?"warn":""}">${{active:"Active",paused:"Paused",done:"Done"}[p.status]}</span></div>
        ${p.desc?`<div class="note" style="margin-top:6px">${esc(p.desc)}</div>`:""}
        <div class="meta"><span>${pr.done}/${pr.total} tasks</span><span>${pr.pct}%</span>${p.due?`<span>Due ${fmtDate(p.due)}</span>`:""}</div>
        <div class="bar"><i style="width:${pr.pct}%;background:${p.color}"></i></div></div>`; }).join("")
      : '<div class="empty">No projects yet. Tap + to create one, then assign tasks to it.</div>';
  }
  $("#view").innerHTML = html;
}
function editGoal(g){
  const isNew = !g; g = g || {title:"",horizon:"short",target:"",progress:0,status:"active",why:""};
  const linked = isNew ? 0 : db.tasks.filter(t=>t.goalId===g.id).length;
  sheet(isNew?"New goal":"Edit goal", `
    <label>Goal</label><input id="f_title" value="${esc(g.title)}" placeholder="What do you want to achieve?">
    <div class="two"><div><label>Horizon</label><select id="f_h"><option value="short" ${g.horizon==="short"?"selected":""}>Short-term</option><option value="long" ${g.horizon==="long"?"selected":""}>Long-term</option></select></div>
    <div><label>Target date</label><input type="date" id="f_target" value="${esc(g.target||"")}"></div></div>
    <label>Status</label><select id="f_status"><option value="active" ${g.status==="active"?"selected":""}>Active</option><option value="done" ${g.status==="done"?"selected":""}>Achieved</option></select>
    ${linked ? `<label>Progress</label><div class="sub" style="color:var(--mute)">${goalProgress(g)}% — calculated from ${linked} linked task${linked>1?"s":""}.</div>`
             : `<label>Progress: <span id="f_pv">${g.progress||0}</span>%</label><input type="range" id="f_prog" min="0" max="100" step="5" value="${g.progress||0}" oninput="f_pv.textContent=this.value"><div class="sub" style="color:var(--mute);font-size:12px">Link tasks to this goal and progress is calculated for you.</div>`}
    <label>Why it matters</label><textarea id="f_why" style="min-height:70px">${esc(g.why||"")}</textarea>`,
    () => {
      const title=$("#f_title").value.trim(); if(!title) return toast("Add a goal"), false;
      const status=$("#f_status").value;
      Object.assign(g,{title,horizon:$("#f_h").value,target:$("#f_target").value,status,why:$("#f_why").value,doneAt:status==="done"?(g.doneAt||Date.now()):null});
      if($("#f_prog")) g.progress = +$("#f_prog").value;
      if(isNew) db.goals.push(Object.assign(g,{id:uid(),createdAt:Date.now()}));
    }, isNew?null:() => { db.goals = db.goals.filter(x=>x!==g); db.tasks.forEach(t=>{ if(t.goalId===g.id) t.goalId=""; }); });
}
function editProject(p){
  const isNew = !p; p = p || {name:"",desc:"",color:COLORS[db.projects.length%COLORS.length],status:"active",due:""};
  const tasks = isNew ? [] : db.tasks.filter(t=>t.projectId===p.id).sort(sortTasks);
  sheet(isNew?"New project":"Edit project", `
    <label>Name</label><input id="f_title" value="${esc(p.name)}" placeholder="Project name">
    <div class="two"><div><label>Status</label><select id="f_status">${["active","paused","done"].map(s=>`<option value="${s}" ${p.status===s?"selected":""}>${s[0].toUpperCase()+s.slice(1)}</option>`).join("")}</select></div>
    <div><label>Due date</label><input type="date" id="f_due" value="${esc(p.due||"")}"></div></div>
    <label>Colour</label><select id="f_color">${COLORS.map((c,i)=>`<option value="${c}" ${p.color===c?"selected":""}>${["Blue","Teal","Green","Orange","Pink","Violet","Lime","Grey"][i]}</option>`).join("")}</select>
    <label>Description</label><textarea id="f_desc" style="min-height:70px">${esc(p.desc||"")}</textarea>
    ${tasks.length?`<label>Tasks in this project (${tasks.filter(t=>t.done).length}/${tasks.length} done)</label>${tasks.map(t=>`<div class="meta" style="font-size:13px">${t.done?"✓":"○"} ${esc(t.title)}</div>`).join("")}`:""}`,
    () => {
      const name=$("#f_title").value.trim(); if(!name) return toast("Add a name"), false;
      Object.assign(p,{name,status:$("#f_status").value,due:$("#f_due").value,color:$("#f_color").value,desc:$("#f_desc").value});
      if(isNew) db.projects.push(Object.assign(p,{id:uid(),createdAt:Date.now()}));
    }, isNew?null:() => { db.projects = db.projects.filter(x=>x!==p); db.tasks.forEach(t=>{ if(t.projectId===p.id) t.projectId=""; }); });
}

/* ---------- analytics ---------- */
function stats(days, offset=0){
  const end = addDays(today(), -offset), start = addDays(end, -(days-1));
  const inR = ts => ts && dayOf(ts) >= start && dayOf(ts) <= end;
  const done = db.tasks.filter(t => t.done && inR(t.doneAt));
  const created = db.tasks.filter(t => inR(t.createdAt));
  const withDue = done.filter(t => t.due);
  const onTime = withDue.filter(t => dayOf(t.doneAt) <= t.due);
  const perDay = {}; for(let i=0;i<days;i++) perDay[addDays(start,i)] = 0;
  done.forEach(t => perDay[dayOf(t.doneAt)]++);
  const lead = done.map(t => (t.doneAt - t.createdAt)/864e5);
  return {start,end,done,created,perDay,
    onTimePct: withDue.length ? Math.round(100*onTime.length/withDue.length) : null,
    avgLead: lead.length ? lead.reduce((a,b)=>a+b,0)/lead.length : null,
    activeDays: Object.values(perDay).filter(v=>v>0).length,
    notes: db.notes.filter(n => inR(n.createdAt)).length};
}
function streak(){
  const days = new Set(db.tasks.filter(t=>t.done).map(t=>dayOf(t.doneAt)));
  let d = today(), n = 0; if(!days.has(d)) d = addDays(d,-1);
  while(days.has(d)){ n++; d = addDays(d,-1); }
  return n;
}
function barChart(perDay){
  const keys = Object.keys(perDay), vals = keys.map(k=>perDay[k]), max = Math.max(1,...vals);
  const W=340,H=150,L=22,B=18,T=8, iw=(W-L-4)/keys.length, bw=Math.max(1.5,iw*0.7);
  const ticks = max<=4 ? [...Array(max+1).keys()] : [0,Math.round(max/2),max];
  const y = v => T+(H-T-B)*(1-v/max);
  const step = Math.ceil(keys.length/6);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tasks completed per day">
    ${ticks.map(v=>`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join("")}
    ${keys.map((k,i)=>`<rect x="${L+i*iw+(iw-bw)/2}" y="${y(vals[i])}" width="${bw}" height="${H-B-y(vals[i])}" rx="${Math.min(2,bw/2)}" fill="var(--accent)"><title>${fmtDate(k)}: ${vals[i]}</title></rect>`).join("")}
    ${keys.map((k,i)=> i%step===0 ? `<text x="${L+i*iw+iw/2}" y="${H-5}" text-anchor="middle">${fmtDate(k)}</text>`:"").join("")}</svg>`;
}
function hbars(rows){
  const max = Math.max(1,...rows.map(r=>r[1]));
  return rows.map(([n,v,c])=>`<div class="hbar"><span class="n">${esc(n)}</span><div class="bar" style="margin:0"><i style="width:${100*v/max}%;${c?`background:${c}`:""}"></i></div><span class="v">${v}</span></div>`).join("");
}
function delta(cur, prev){
  if(!prev && !cur) return "no change"; if(!prev) return "new activity";
  const p = Math.round(100*(cur-prev)/prev); return (p>0?"▲ ":p<0?"▼ ":"")+Math.abs(p)+"% vs previous";
}
function viewInsights(){
  $("#title").textContent = "Insights"; $("#subtitle").textContent = "Analytics and reports";
  const s = state.insSeg;
  let html = `<div class="seg"><button data-set="insSeg:analytics" class="${s==="analytics"?"on":""}">Analytics</button><button data-set="insSeg:reports" class="${s==="reports"?"on":""}">Reports</button><button data-set="insSeg:data" class="${s==="data"?"on":""}">Data</button></div>`;
  if(s==="analytics"){
    const R = state.range, cur = stats(R), prev = stats(R,R), td = today();
    const open = db.tasks.filter(t=>!t.done), overdue = open.filter(t=>t.due&&t.due<td);
    const rate = cur.created.length ? Math.round(100*cur.done.length/cur.created.length) : null;
    const byProj = db.projects.map(p=>[p.name, cur.done.filter(t=>t.projectId===p.id).length, p.color]).concat([["No project",cur.done.filter(t=>!proj(t.projectId)).length,"var(--mute)"]]).filter(r=>r[1]>0).sort((a,b)=>b[1]-a[1]);
    const wd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map((n,i)=>[n,cur.done.filter(t=>new Date(t.doneAt).getDay()===i).length]);
    const best = wd.slice().sort((a,b)=>b[1]-a[1])[0];
    const age = open.map(t=>(Date.now()-t.createdAt)/864e5);
    html += `<div class="seg">${[7,30,90].map(n=>`<button data-set="range:${n}" class="${R===n?"on":""}">Last ${n} days</button>`).join("")}</div>
    <div class="tiles">
      <div class="tile"><div class="k">Tasks completed</div><div class="v">${cur.done.length}</div><div class="d">${delta(cur.done.length,prev.done.length)}</div></div>
      <div class="tile"><div class="k">Completed vs created</div><div class="v">${rate===null?"–":rate+"%"}</div><div class="d">${cur.created.length} created</div></div>
      <div class="tile"><div class="k">On-time rate</div><div class="v">${cur.onTimePct===null?"–":cur.onTimePct+"%"}</div><div class="d">of tasks with a due date</div></div>
      <div class="tile"><div class="k">Current streak</div><div class="v">${streak()}<span style="font-size:14px;font-weight:500"> day${streak()===1?"":"s"}</span></div><div class="d">${cur.activeDays}/${R} active days</div></div>
      <div class="tile"><div class="k">Avg time to finish</div><div class="v">${cur.avgLead===null?"–":cur.avgLead<1?"<1":cur.avgLead.toFixed(1)}<span style="font-size:14px;font-weight:500"> d</span></div><div class="d">from created to done</div></div>
      <div class="tile"><div class="k">Open / overdue</div><div class="v">${open.length}<span style="font-size:14px;font-weight:500;color:${overdue.length?"var(--bad)":"var(--mute)"}"> / ${overdue.length}</span></div><div class="d">${age.length?"avg age "+(age.reduce((a,b)=>a+b,0)/age.length).toFixed(1)+" d":"backlog clear"}</div></div>
    </div>
    <div class="card"><h3>Completed per day</h3>${barChart(cur.perDay)}</div>
    <div class="card"><h3>Completed by project</h3>${byProj.length?hbars(byProj):'<div class="empty">No completed tasks in this period.</div>'}</div>
    <div class="card"><h3>Completed by priority</h3>${hbars([1,2,3].map(n=>[PRI[n],cur.done.filter(t=>t.priority==n).length]))}</div>
    <div class="card"><h3>Most productive weekday</h3>${hbars(wd)}${best[1]?`<div class="meta">You finish most on ${best[0]}.</div>`:""}</div>
    <div class="card"><h3>Goal progress</h3>${db.goals.length?db.goals.map(goalRow).join(""):'<div class="empty">No goals yet.</div>'}</div>
    <div class="card"><h3>Project health</h3>${db.projects.length?db.projects.map(p=>{const pr=projProgress(p), od=db.tasks.filter(t=>t.projectId===p.id&&!t.done&&t.due&&t.due<td).length;
      return `<div class="row"><div class="body"><div class="t"><span class="dot" style="background:${p.color}"></span> ${esc(p.name)}</div><div class="meta"><span>${pr.done}/${pr.total} tasks · ${pr.pct}%</span>${od?`<span class="pill bad">${od} overdue</span>`:""}</div><div class="bar"><i style="width:${pr.pct}%;background:${p.color}"></i></div></div></div>`}).join(""):'<div class="empty">No projects yet.</div>'}</div>`;
  } else if(s==="reports"){
    const per = state.reportPeriod;
    html += `<div class="seg">${[["week","Weekly"],["month","Monthly"],["quarter","Quarterly"]].map(([k,l])=>`<button data-set="reportPeriod:${k}" class="${per===k?"on":""}">${l}</button>`).join("")}</div>
      <div class="card"><pre class="report">${esc(buildReport(per))}</pre></div>
      <div style="display:flex;gap:8px"><button class="btn" style="flex:1" data-act="saveReport">Save report</button><button class="btn ghost" style="flex:1" data-act="shareReport">Share</button></div>`;
  } else {
    html += `<div class="card"><h3>Export</h3><p style="margin:0 0 10px;color:var(--mute)">Everything is stored on this device only. Back it up regularly.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="exportJson">Backup (JSON)</button><button class="btn ghost" data-act="exportCsv">Tasks (CSV)</button></div></div>
      <div class="card"><h3>Restore</h3><p style="margin:0 0 10px;color:var(--mute)">Restoring replaces all current data with the backup file.</p><button class="btn ghost" data-act="importJson">Restore from backup</button></div>
      <div class="card"><h3>Reset</h3><button class="btn danger" data-act="wipe">Delete all data</button></div>`;
  }
  $("#view").innerHTML = html;
}
function buildReport(per){
  const days = {week:7,month:30,quarter:90}[per], cur = stats(days), prev = stats(days,days), td = today();
  const open = db.tasks.filter(t=>!t.done), overdue = open.filter(t=>t.due&&t.due<td);
  const L = [];
  L.push(`${{week:"WEEKLY",month:"MONTHLY",quarter:"QUARTERLY"}[per]} REPORT`, `${fmtDate(cur.start)} – ${fmtDate(cur.end)}`, "");
  L.push("SUMMARY");
  L.push(`  Tasks completed: ${cur.done.length} (previous period: ${prev.done.length})`);
  L.push(`  Tasks created:   ${cur.created.length}`);
  L.push(`  On-time rate:    ${cur.onTimePct===null?"n/a":cur.onTimePct+"%"}`);
  L.push(`  Active days:     ${cur.activeDays} of ${days}`);
  L.push(`  Notes written:   ${cur.notes}`);
  L.push(`  Open tasks:      ${open.length} (${overdue.length} overdue)`, "");
  L.push("COMPLETED");
  if(cur.done.length) cur.done.slice().sort((a,b)=>b.doneAt-a.doneAt).forEach(t=>L.push(`  ✓ ${t.title}${proj(t.projectId)?" ["+proj(t.projectId).name+"]":""}`)); else L.push("  Nothing completed in this period.");
  L.push("", "OVERDUE");
  if(overdue.length) overdue.sort(sortTasks).forEach(t=>L.push(`  ! ${t.title} (due ${fmtDate(t.due)})`)); else L.push("  None.");
  L.push("", "GOALS");
  if(db.goals.length) db.goals.forEach(g=>L.push(`  ${g.status==="done"?"★":"◎"} ${g.title} — ${goalProgress(g)}% (${g.horizon}-term${g.target?", target "+fmtDate(g.target):""})`)); else L.push("  No goals set.");
  L.push("", "PROJECTS");
  if(db.projects.length) db.projects.forEach(p=>{const pr=projProgress(p); L.push(`  ${p.name} — ${pr.done}/${pr.total} tasks, ${pr.pct}% (${p.status})`);}); else L.push("  No projects.");
  return L.join("\n");
}

/* ---------- export / import (Android bridge with browser fallback) ---------- */
function saveFile(name, mime, text){
  if(window.Android && Android.saveFile){ Android.saveFile(name, mime, text); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text],{type:mime})); a.download = name; a.click();
}
window.onFileSaved = ok => toast(ok ? "Saved" : "Could not save file");
const csvCell = v => { let s = String(v ?? ""); if(/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g,'""') + '"'; };
const ACTIONS = {
  saveReport(){ saveFile(`report-${state.reportPeriod}-${today()}.txt`,"text/plain",buildReport(state.reportPeriod)); },
  shareReport(){ const txt = buildReport(state.reportPeriod);
    if(window.Android && Android.shareText) Android.shareText(txt);
    else if(navigator.share) navigator.share({text:txt}); else toast("Sharing not available here"); },
  exportJson(){ saveFile(`workspace-backup-${today()}.json`,"application/json",JSON.stringify(db,null,2)); },
  exportCsv(){
    const rows = [["Title","Status","Priority","Due","Project","Goal","Created","Completed","Details"]]
      .concat(db.tasks.map(t=>[t.title,t.done?"Done":"Open",PRI[t.priority],t.due||"",proj(t.projectId)?.name||"",goal(t.goalId)?.title||"",dayOf(t.createdAt),t.doneAt?dayOf(t.doneAt):"",t.notes||""]));
    saveFile(`tasks-${today()}.csv`,"text/csv",rows.map(r=>r.map(csvCell).join(",")).join("\r\n"));
  },
  importJson(){ $("#importFile").value=""; $("#importFile").click(); },
  wipe(){ confirmSheet("Delete all data?","This removes every task, note, goal and project from this device. It cannot be undone.","Delete everything",()=>{ db={tasks:[],notes:[],goals:[],projects:[]}; save(); render(); toast("All data deleted"); }); }
};
$("#importFile").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !["tasks","notes","goals","projects"].every(k=>Array.isArray(d[k]))) throw 0;
      confirmSheet("Restore this backup?",`It contains ${d.tasks.length} tasks, ${d.notes.length} notes, ${d.goals.length} goals and ${d.projects.length} projects. Your current data will be replaced.`,"Restore",()=>{ db={tasks:d.tasks,notes:d.notes,goals:d.goals,projects:d.projects}; save(); render(); toast("Backup restored"); });
    }catch(_){ toast("That file is not a valid backup"); }
  };
  r.readAsText(f);
};

/* ---------- sheets ---------- */
function closeSheet(){ $("#modal").innerHTML = ""; }
function sheet(title, body, onSave, onDelete){
  $("#modal").innerHTML = `<div class="sheet-bg"><div class="sheet"><h2>${title}</h2>${body}
    <div class="actions">${onDelete?'<button class="btn danger" id="s_del">Delete</button>':""}<button class="btn ghost" id="s_cancel">Cancel</button><button class="btn" id="s_save">Save</button></div></div></div>`;
  $("#s_cancel").onclick = closeSheet;
  $(".sheet-bg").onclick = e => { if(e.target.classList.contains("sheet-bg")) closeSheet(); };
  $("#s_save").onclick = () => { if(onSave() === false) return; save(); closeSheet(); render(); };
  if(onDelete){ let armed = false; $("#s_del").onclick = e => { if(!armed){ armed = true; e.target.textContent = "Tap again to delete"; return; } onDelete(); save(); closeSheet(); render(); }; }
}
function confirmSheet(title, msg, okLabel, onOk){
  $("#modal").innerHTML = `<div class="sheet-bg"><div class="sheet"><h2>${esc(title)}</h2><p style="color:var(--mute)">${esc(msg)}</p>
    <div class="actions"><button class="btn ghost" id="s_cancel">Cancel</button><button class="btn danger" id="s_ok">${esc(okLabel)}</button></div></div></div>`;
  $("#s_cancel").onclick = closeSheet; $("#s_ok").onclick = () => { closeSheet(); onOk(); };
}
/* Android back button: returns true if handled */
window.handleBack = () => {
  if($("#modal").innerHTML){ closeSheet(); return true; }
  if(state.tab !== "today"){ state.tab = "today"; render(); return true; }
  return false;
};
render();
</script>
